<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datarova Bulk Export</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Datarova Bulk Export</h1>
      <p class="subtitle">Export Daily Ranks across all projects</p>
    </header>

    <div id="not-on-datarova" class="notice hidden">
      <p>Navigate to <strong>app.datarova.com/projects</strong> to use this extension.</p>
    </div>

    <div id="main-controls">
      <!-- Marketplace Filter -->
      <section class="control-group">
        <label for="marketplace-filter">Marketplace</label>
        <select id="marketplace-filter">
          <option value="all">All Marketplaces</option>
        </select>
      </section>

      <!-- Projects -->
      <section class="control-group">
        <label>Projects <span id="project-count" class="count-badge">0</span></label>
        <div id="projects-loading" class="loading-text">Detecting projects...</div>
        <div id="projects-list" class="checkbox-grid hidden"></div>
        <div id="no-projects" class="notice hidden">
          <p>No projects found. Make sure you are on the projects page.</p>
        </div>
        <div class="select-actions">
          <button id="select-all-projects" class="link-btn">Select All</button>
          <button id="deselect-all-projects" class="link-btn">Deselect All</button>
        </div>
      </section>

      <!-- Actions -->
      <section class="actions">
        <button id="btn-export" class="btn-primary">
          <span id="btn-text">Export Daily Ranks</span>
          <span id="btn-spinner" class="spinner hidden"></span>
        </button>
        <button id="btn-cancel" class="btn-secondary hidden">Cancel</button>
      </section>

      <!-- Progress -->
      <section id="progress-section" class="hidden">
        <p id="phase-label" class="phase-label hidden"></p>
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
        <p id="progress-text" class="progress-text">Preparing...</p>
        <div id="download-log" class="download-log"></div>
      </section>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
